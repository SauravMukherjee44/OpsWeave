[project]
name = "opsweave-api"
version = "0.1.0"
description = "OpsWeave production API"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21,<1",
  "boto3>=1.40,<2",
  "fastapi>=0.116,<1",
  "greenlet>=3.2,<4",
  "mangum>=0.19,<1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.40,<3",
  "uvicorn[standard]>=0.35,<1"
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<9", "pytest-asyncio>=1.1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opsweave_api"]
